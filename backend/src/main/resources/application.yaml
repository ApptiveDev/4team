spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    jwt-secret: ${APP_JWT_SECRET}
    access-token-expiration-days: ${APP_ACCESS_TOKEN_EXPIRATION_DAYS:30}
  storage:
    type: ${STORAGE_TYPE:local}
    local-directory: ${LOCAL_STORAGE_DIRECTORY:${java.io.tmpdir}/4team-recordings}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:}
    signed-url-duration: ${R2_SIGNED_URL_DURATION:15m}
